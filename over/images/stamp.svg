<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Shuvam Overseas Employment PVT.LTD - Kathmandu">
  <!-- Rubber-stamp seal: circular crimson ink mark, double ring + curved text -->
  <g fill="none" stroke="#B54B06">
    <!-- outer ink ring -->
    <circle cx="100" cy="100" r="90" stroke-width="3.5"/>
    <!-- inner ring (thin) -->
    <circle cx="100" cy="100" r="82" stroke-width="1.25" stroke-dasharray="3 3"/>
  </g>

  <!-- curved text paths -->
  <defs>
    <path id="arc-top" d="M 34 100 A 66 66 0 0 1 166 100"/>
    <path id="arc-bot" d="M 166 100 A 66 66 0 0 1 34 100"/>
  </defs>

  <!-- top arc: reads left to right along the crown -->
  <text fill="#B54B06" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="600" letter-spacing="2.2">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">SHUVAM OVERSEAS EMPLOYMENT</textPath>
  </text>

  <!-- bottom arc: reads left to right along the foot -->
  <text fill="#B54B06" font-family="Consolas, 'Courier New', monospace" font-size="6.5" font-weight="500" letter-spacing="1.75">
    <textPath href="#arc-bot" startOffset="50%" text-anchor="middle">PVT. LTD. · MANPOWER RECRUITMENT</textPath>
  </text>

  <!-- centre block -->
  <g fill="#B54B06">
    <path d="M 100 78 l 4 4 -4 4 -4 -4 z"/>
    <text x="100" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="2">KATHMANDU</text>
    <text x="100" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="600" letter-spacing="4">NEPAL</text>
  </g>
</svg>
